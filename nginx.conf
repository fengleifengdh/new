server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # SPA entry and fallback
  location /bayer-mobile/ {
    try_files $uri $uri/ /bayer-mobile/index.html;

    # Assets within the app path get long cache
    location /bayer-mobile/assets/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }
  }
}
