services:
  bayer-wecom-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayer-wecom-mobile:latest
    container_name: bayer-wecom-mobile
    restart: unless-stopped
    # 生产环境: 由外部 Nginx 反代，只 expose 不暴露端口
    expose:
      - "80"
    # 本地/独立使用: 取消下面注释，注释掉 expose
    # ports:
    #   - "8080:80"
    networks:
      - shared-proxy

networks:
  shared-proxy:
    # 加入已有的共享网络，让外部 Nginx 可以找到这个容器
    # 如果网络不存在，先在服务器执行: docker network create shared-proxy
    name: shared-proxy
    external: true
